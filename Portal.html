<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SST GameHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style id="s1">
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;
  --border:#30363d;--border2:#21262d;
  --text:#e6edf3;--text2:#8b949e;--text3:#6e7681;
  --blue:#1f6feb;--blue2:#388bfd;--blue3:#cae8ff;
  --green:#3fb950;--green2:#56d364;
  --orange:#d29922;--orange2:#e3b341;
  --red:#da3633;--red2:#f85149;
  --purple:#8957e5;--purple2:#a5d6ff;
  --gold:#e3b341;
  --sb:248px;--r:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="LS" style="position:fixed;inset:0;z-index:999;background:linear-gradient(135deg,#0d1117 0%,#0a1628 60%,#0d1117 100%);display:flex;align-items:center;justify-content:center">
  <div id="LB" style="background:#161b22;border:1px solid #30363d;border-radius:16px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,.6);animation:fadeUp .5s ease">
    <div style="text-align:center;margin-bottom:28px">
      <div style="width:58px;height:58px;margin:0 auto 12px;background:linear-gradient(135deg,#1f6feb,#388bfd);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 8px 24px rgba(31,111,235,.4)">🛡️</div>
      <div style="font-size:20px;font-weight:800;letter-spacing:-.4px">SST GameHub</div>
      <div style="font-size:12px;color:var(--text2);margin-top:3px">Seguridad y Salud en el Trabajo</div>
    </div>
    <div id="LE" style="display:none;background:#3d1c1c;border:1px solid #da3633;border-radius:8px;padding:10px 14px;color:#f85149;font-size:13px;font-weight:600;margin-bottom:14px"></div>
    <label style="display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px">Número de DNI</label>
    <input id="DI" type="text" maxlength="15" autocomplete="off" placeholder="Ej: 12345678"
      style="width:100%;padding:12px 14px;font-size:16px;font-weight:700;font-family:'Inter';background:#0d1117;border:2px solid #30363d;border-radius:8px;color:#e6edf3;outline:none;letter-spacing:2px;transition:border .2s"
      onfocus="this.style.borderColor='#1f6feb'" onblur="this.style.borderColor='#30363d'"
      onkeypress="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()" id="LBtn"
      style="width:100%;margin-top:14px;padding:13px;font-size:14px;font-weight:700;font-family:'Inter';background:linear-gradient(135deg,#1f6feb,#388bfd);border:none;border-radius:8px;color:#fff;cursor:pointer;transition:opacity .2s;box-shadow:0 4px 14px rgba(31,111,235,.4)">
      <span id="LBT">Ingresar al sistema</span>
      <span id="LBS" style="display:none">⏳ Verificando...</span>
    </button>
    <div style="text-align:center;margin-top:14px">
      <a href="#" onclick="goAdmin();return false" style="color:var(--text3);font-size:12px;font-weight:600;text-decoration:none">⚙️ Panel de Administración</a>
    </div>
  </div>
</div>

<!-- HAMBURGER -->
<button id="HAM" onclick="toggleSB()" style="display:none;position:fixed;top:10px;left:10px;z-index:200;width:38px;height:38px;background:#161b22;border:1px solid #30363d;border-radius:8px;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:4px">
  <span style="width:16px;height:2px;background:#8b949e;border-radius:2px;display:block"></span>
  <span style="width:16px;height:2px;background:#8b949e;border-radius:2px;display:block"></span>
  <span style="width:16px;height:2px;background:#8b949e;border-radius:2px;display:block"></span>
</button>
<div id="SBO" onclick="closeSB()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:49;backdrop-filter:blur(2px)"></div>

<!-- LEVEL UP OVERLAY -->
<div id="LUO" style="display:none;position:fixed;inset:0;z-index:998;background:rgba(0,0,0,.85);align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(4px)">
  <div id="LUB" style="text-align:center;animation:lvlUp .6s cubic-bezier(.34,1.56,.64,1)">
    <div style="font-size:72px;margin-bottom:8px">🎉</div>
    <div style="font-size:14px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px">¡SUBISTE DE NIVEL!</div>
    <div id="LUN" style="font-size:48px;font-weight:900;color:#fff;letter-spacing:-2px"></div>
    <div id="LUT" style="font-size:18px;color:var(--gold);font-weight:700;margin-top:4px"></div>
    <button onclick="document.getElementById('LUO').style.display='none'" style="margin-top:24px;padding:12px 32px;background:linear-gradient(135deg,#1f6feb,#388bfd);border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter'">¡Continuar!</button>
  </div>
</div>

<!-- BADGE TOAST -->
<div id="BTO" style="display:none;position:fixed;bottom:24px;right:24px;z-index:997;background:#161b22;border:1px solid #3fb950;border-radius:12px;padding:14px 18px;min-width:260px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:slideIn .4s ease">
  <div style="font-size:11px;font-weight:700;color:#3fb950;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">🏅 ¡Insignia desbloqueada!</div>
  <div style="display:flex;align-items:center;gap:10px">
    <div id="BTI" style="font-size:28px"></div>
    <div><div id="BTN" style="font-size:14px;font-weight:700;color:#e6edf3"></div><div id="BTD" style="font-size:12px;color:#8b949e;margin-top:2px"></div></div>
  </div>
</div>

<!-- APP -->
<div id="APP" style="display:none;width:100%;height:100vh;overflow:hidden;display:none">
<style>
.sb{width:var(--sb);min-width:var(--sb);height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform .28s ease;z-index:50;position:relative}
.sb-h{padding:16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.sb-logo{width:34px;height:34px;background:linear-gradient(135deg,#1f6feb,#388bfd);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sb-nav{flex:1;padding:8px 6px;overflow-y:auto;scrollbar-width:none}
.sb-nav::-webkit-scrollbar{display:none}
.nl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:10px 8px 4px}
.ni{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all .15s;margin-bottom:1px;border:none;background:none;width:100%;text-align:left;font-family:'Inter'}
.ni:hover{background:var(--bg3);color:var(--text)}
.ni.on{background:#1f2d3d;color:var(--blue2);font-weight:600}
.ni .ic{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;background:rgba(255,255,255,.05);flex-shrink:0}
.ni.on .ic{background:rgba(31,111,235,.2)}
.ni .tg{background:rgba(255,255,255,.06);color:var(--text3);font-size:9px;font-weight:700;padding:2px 5px;border-radius:5px;margin-left:auto}
.ni.on .tg{background:rgba(31,111,235,.25);color:var(--blue2)}
.sb-xp{padding:10px 12px;border-top:1px solid var(--border);flex-shrink:0}
.xpbar-wrap{background:var(--bg3);border-radius:4px;height:5px;margin:4px 0 2px;overflow:hidden}
.xpbar-fill{height:100%;border-radius:4px;transition:width 1s ease;background:linear-gradient(90deg,#1f6feb,#388bfd)}
.sb-f{padding:8px 6px 12px;border-top:1px solid var(--border);flex-shrink:0}
.upill{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.03);margin-bottom:5px}
.uav{width:32px;height:32px;background:linear-gradient(135deg,#3fb950,#56d364);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;flex-shrink:0;position:relative}
.lvring{position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--gold)}
.sbb{display:flex;align-items:center;gap:7px;width:100%;padding:7px 10px;border-radius:7px;background:none;border:none;color:var(--text3);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:'Inter'}
.sbb:hover{background:var(--bg3);color:var(--text2)}
.sbb.red:hover{color:var(--red2)}
.main{flex:1;height:100vh;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.view{flex:1;overflow-y:auto;padding:24px 26px;display:none;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.view.on{display:block}
#VG{flex:1;display:none;flex-direction:column}
#VG.on{display:flex}
.gbar{padding:9px 14px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.gbk{width:30px;height:30px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.gbk:hover{background:var(--border);color:var(--text)}
#GF{flex:1;border:none;width:100%;display:block;background:var(--bg)}
.fload{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5}
.fring{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@media(max-width:768px){
  .sb{position:fixed;left:0;top:0;transform:translateX(-100%)}
  .sb.open{transform:translateX(0)}
  #SBO.show{display:block!important}
  #HAM{display:flex!important}
  .main{width:100%}
  .view{padding:14px;padding-top:56px}
}
</style>

<div style="display:flex;width:100%;height:100vh">
<!-- SIDEBAR -->
<aside class="sb" id="SB">
  <div class="sb-h">
    <div class="sb-logo">🛡️</div>
    <div>
      <div style="font-size:13px;font-weight:800;color:var(--text)">SST GameHub</div>
      <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px">Seg. Laboral</div>
    </div>
  </div>
  <nav class="sb-nav">
    <div class="nl">Principal</div>
    <button class="ni on" id="nI" onclick="showV('I')"><div class="ic">🏠</div><span>Inicio</span></button>
    <button class="ni" id="nP" onclick="showV('P')"><div class="ic">👤</div><span>Mi Perfil</span></button>
    <button class="ni" id="nR" onclick="showV('R')"><div class="ic">🏆</div><span>Ranking</span></button>
    <button class="ni" id="nM" onclick="showV('M')"><div class="ic">🎯</div><span>Misiones</span></button>
    <div class="nl" style="margin-top:4px">Módulos</div>
    <button class="ni" id="nKahoot" onclick="play('Kahoot')"><div class="ic">🚀</div><span>Kahoot Arena</span><span class="tg">ÉPICO</span></button>
    <button class="ni" id="nMahjong" onclick="play('Mahjong')"><div class="ic">🀄</div><span>Mahjong SST</span><span class="tg">IA</span></button>
    <button class="ni" id="nMemoria" onclick="play('Memoria')"><div class="ic">🧠</div><span>Memoria SST</span><span class="tg">IA</span></button>
    <button class="ni" id="nDragDrop" onclick="play('DragDrop')"><div class="ic">🎯</div><span>Arrastra y Clasifica</span><span class="tg">IA</span></button>
    <button class="ni" id="nSimulacion" onclick="play('Simulacion')"><div class="ic">🏗️</div><span>Simulación</span><span class="tg">IA</span></button>
    <button class="ni" id="nPupiletras" onclick="play('Pupiletras')"><div class="ic">🔤</div><span>Pupiletras SST</span><span class="tg">NUEVO</span></button>
    <button class="ni" id="nCrucigrama" onclick="play('Crucigrama')"><div class="ic">✏️</div><span>Crucigrama SST</span><span class="tg">NUEVO</span></button>
  </nav>
  <div class="sb-xp" id="sbXP" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span id="sbLvN" style="font-size:11px;font-weight:700;color:var(--gold)">Nivel 1 · Novato</span>
      <span id="sbXPN" style="font-size:10px;color:var(--text3)">0 XP</span>
    </div>
    <div class="xpbar-wrap"><div class="xpbar-fill" id="sbXPB" style="width:0%"></div></div>
    <div id="sbXPC" style="font-size:10px;color:var(--text3)">0 XP para siguiente nivel</div>
  </div>
  <div class="sb-f">
    <div class="upill">
      <div class="uav" id="UAV"><div class="lvring" id="LAVR"></div><span id="UAVT">--</span></div>
      <div style="min-width:0">
        <div style="font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="UNM">—</div>
        <div style="font-size:11px;color:var(--text3)" id="UDNI">DNI: —</div>
      </div>
    </div>
    <button class="sbb" onclick="goAdmin()">⚙️ Centro de Mando</button>
    <button class="sbb red" onclick="doLogout()">↩ Cerrar sesión</button>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div id="VI" class="view on"></div>
  <div id="VP" class="view"></div>
  <div id="VR" class="view"></div>
  <div id="VM" class="view"></div>
  <div id="VG" style="flex:1;display:none;flex-direction:column;position:relative">
    <div class="fload" id="FL"><div class="fring"></div><div style="font-size:13px;color:var(--text2)" id="FLT">Cargando...</div></div>
    <div class="gbar">
      <button class="gbk" onclick="showV('I')" title="Volver">←</button>
      <span style="font-size:13px;font-weight:700;color:var(--text)" id="GT">Módulo</span>
      <div style="width:1px;height:14px;background:var(--border)"></div>
      <span style="font-size:12px;color:var(--text3)" id="GU"></span>
      <button class="gbk" onclick="reloadG()" title="Reiniciar" style="margin-left:auto">↺</button>
    </div>
    <iframe id="GF" src="" allowfullscreen onload="hideFLoad()" onerror="hideFLoad()"></iframe>
  </div>
</main>
</div>
</div>

<style id="s2">
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}}
@keyframes lvlUp{from{opacity:0;transform:scale(.5)}}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes xpFill{from{width:0%}}
</style>
<script>
let U=null,WU='',AG='',prevLevel=0,PROF={xp:0,total:0,best:0,uniq:0,qBest:0,gBest:{},scores:[]};
const GS={Kahoot:{n:'Kahoot Arena',ic:'🚀',diff:'Épico',col:'#00f5ff'},Mahjong:{n:'Mahjong SST',ic:'🀄',diff:'Medio',col:'#d29922'},Memoria:{n:'Memoria SST',ic:'🧠',diff:'Fácil',col:'#8957e5'},DragDrop:{n:'Arrastra y Clasifica',ic:'🎯',diff:'Medio',col:'#3fb950'},Simulacion:{n:'Simulación de Riesgos',ic:'🏗️',diff:'Difícil',col:'#da3633'},Pupiletras:{n:'Pupiletras SSOMA',ic:'🔤',diff:'Medio',col:'#c678ff'},Crucigrama:{n:'Crucigrama SSOMA',ic:'✏️',diff:'Difícil',col:'#3bdcff'}};
const LVS=[{l:1,n:'Novato',min:0,max:100,c:'#6e7681'},{l:2,n:'Aprendiz',min:100,max:250,c:'#1f6feb'},{l:3,n:'Practicante',min:250,max:500,c:'#3fb950'},{l:4,n:'Competente',min:500,max:900,c:'#d29922'},{l:5,n:'Avanzado',min:900,max:1500,c:'#e85c1a'},{l:6,n:'Experto',min:1500,max:2500,c:'#da3633'},{l:7,n:'Maestro',min:2500,max:4000,c:'#8957e5'},{l:8,n:'Gurú SST',min:4000,max:99999,c:'#e3b341'}];
const BGS=[{id:'fv',ic:'🎯',n:'Primera Victoria',d:'Completa tu primer juego',f:p=>p.total>=1},{id:'v10',ic:'🎖️',n:'Veterano',d:'Juega 10 partidas',f:p=>p.total>=10},{id:'v30',ic:'💎',n:'Leyenda',d:'Juega 30 partidas',f:p=>p.total>=30},{id:'cs',ic:'🏆',n:'Campeón',d:'Supera 1000 pts en un juego',f:p=>p.best>=1000},{id:'qm',ic:'🧠',n:'Quiz Master',d:'Quiz SST > 900 pts',f:p=>p.qBest>=900},{id:'ag',ic:'🏅',n:'Especialista SST',d:'Juega los 7 módulos',f:p=>p.uniq>=7},{id:'x1',ic:'⭐',n:'Acumulador',d:'Consigue 1000 XP',f:p=>p.xp>=1000},{id:'x5',ic:'🌟',n:'Elite SST',d:'Consigue 5000 XP',f:p=>p.xp>=5000},{id:'mem',ic:'🎭',n:'Mente Ágil',d:'Completa Memoria SST',f:p=>(p.gBest['Memoria SST']||0)>0},{id:'sim',ic:'🔍',n:'Inspector',d:'Completa Simulación de Riesgos',f:p=>(p.gBest['Simulación de Riesgos']||0)>0}];
function getLvl(xp){return LVS.slice().reverse().find(l=>xp>=l.min)||LVS[0]}
function xpPct(xp){const l=getLvl(xp);return l.max===99999?99:Math.min(99,Math.round((xp-l.min)/(l.max-l.min)*100))}
function calcBadges(p){return BGS.map(b=>({...b,earned:b.f(p)}))}

// ── LOGIN ──
function doLogin(){
  const dni=document.getElementById('DI').value.trim();
  if(!dni){showLE('Ingresa tu número de DNI');return}
  const btn=document.getElementById('LBtn');
  btn.disabled=true;
  document.getElementById('LBT').style.display='none';
  document.getElementById('LBS').style.display='';
  document.getElementById('LE').style.display='none';
  try{
    google.script.run
      .withSuccessHandler(r=>{
        btn.disabled=false;document.getElementById('LBT').style.display='';document.getElementById('LBS').style.display='none';
        if(r&&r.success){U=r.user;sessionStorage.setItem('sst_u',JSON.stringify(U));bootApp()}
        else showLE((r&&r.error)||'DNI no registrado');
      })
      .withFailureHandler(()=>{
        btn.disabled=false;document.getElementById('LBT').style.display='';document.getElementById('LBS').style.display='none';
        showLE('Error de conexión. Intenta de nuevo.');
      })
      .validateLogin(dni);
  }catch(e){
    btn.disabled=false;document.getElementById('LBT').style.display='';document.getElementById('LBS').style.display='none';
    showLE('Sin conexion con el servidor. Verifica tu acceso e intenta de nuevo.');
  }
}
function showLE(m){const e=document.getElementById('LE');e.textContent=m;e.style.display='block'}

// ── BOOT ──
function bootApp(){
  document.getElementById('LS').style.display='none';
  const app=document.getElementById('APP');
  app.style.display='flex';
  const n=U.nombre||'Usuario',a=U.apellido||'';
  const ini=(n[0]+(a[0]||n[1]||'?')).toUpperCase();
  document.getElementById('UAVT').textContent=ini;
  document.getElementById('UNM').textContent=n+(a?' '+a:'');
  document.getElementById('UDNI').textContent='DNI: '+U.dni;
  document.getElementById('GU').textContent=n+' · DNI '+U.dni;
  try{google.script.run.withSuccessHandler(u=>{WU=u}).getWebAppUrl()}catch(e){}
  loadProfile(true);
  showV('I');
}

// ── PERFIL BACKEND ──
function loadProfile(initial){
  try{
    google.script.run.withSuccessHandler(r=>{
      if(!r||!r.success)return;
      const oldXP=PROF.xp;
      const oldBadges=calcBadges(PROF).filter(b=>b.earned).map(b=>b.id).sort().join();
      PROF={xp:r.totalXP||0,total:r.scores.length,best:r.bestScore||0,uniq:(r.uniqueGames||[]).length,qBest:r.gameBest&&r.gameBest['Quiz SST']||0,gBest:r.gameBest||{},scores:r.scores||[]};
      const newLv=getLvl(PROF.xp);
      if(!initial&&newLv.l>prevLevel&&prevLevel>0)showLvlUp(newLv);
      prevLevel=newLv.l;
      const newBadges=calcBadges(PROF).filter(b=>b.earned).map(b=>b.id).sort().join();
      if(!initial&&newBadges!==oldBadges){
        const justEarned=calcBadges(PROF).filter(b=>b.earned&&!oldBadges.includes(b.id));
        if(justEarned.length)setTimeout(()=>showBadgeToast(justEarned[0]),800);
      }
      updateSidebar();
      renderHome();
    }).getUserProfileFull(U.dni);
  }catch(e){}
}

function updateSidebar(){
  const lv=getLvl(PROF.xp);
  const pct=xpPct(PROF.xp);
  const sbXP=document.getElementById('sbXP');
  sbXP.style.display='block';
  document.getElementById('sbLvN').textContent='Nivel '+lv.l+' · '+lv.n;
  document.getElementById('sbLvN').style.color=lv.c;
  document.getElementById('sbXPN').textContent=PROF.xp+' XP';
  document.getElementById('sbXPB').style.width=pct+'%';
  document.getElementById('sbXPB').style.background='linear-gradient(90deg,'+lv.c+','+lv.c+'aa)';
  const toNext=lv.max===99999?'MAX':lv.max-PROF.xp+' XP para '+getLvl(PROF.xp+1).n;
  document.getElementById('sbXPC').textContent=toNext;
  document.getElementById('LAVR').style.borderColor=lv.c;
}

// ── VISTAS ──
function showV(v){
  ['I','P','R','M'].forEach(k=>{
    document.getElementById('V'+k).classList.toggle('on',k===v);
  });
  const vg=document.getElementById('VG');
  vg.style.display=v==='G'?'flex':'none';
  document.querySelectorAll('.ni').forEach(el=>el.classList.remove('on'));
  const nav=document.getElementById('n'+(v==='G'?AG:v));
  if(nav)nav.classList.add('on');
  AG=v==='G'?AG:'';
  closeSB();
  if(v==='P')renderProfile();
  if(v==='R')renderRanking();
  if(v==='M')renderMissions();
}

// ── NAVEGACIÓN ──
function toggleSB(){document.getElementById('SB').classList.toggle('open');document.getElementById('SBO').classList.toggle('show')}
function closeSB(){document.getElementById('SB').classList.remove('open');document.getElementById('SBO').classList.remove('show')}

// ── JUEGOS ──
function play(g){
  AG=g;
  document.getElementById('GT').textContent=GS[g].n;
  document.getElementById('FLT').textContent='Cargando '+GS[g].n+'...';
  document.getElementById('FL').style.opacity='1';
  document.getElementById('FL').style.pointerEvents='auto';
  const load=u=>{document.getElementById('GF').src=u+'?page='+g+'&dni='+encodeURIComponent(U.dni)+'&nombre='+encodeURIComponent(U.nombre||'')+'&apellido='+encodeURIComponent(U.apellido||'')};
  if(WU)load(WU);
  else try{google.script.run.withSuccessHandler(u=>{WU=u;load(u)}).getWebAppUrl()}catch(e){}
  ['I','P','R','M'].forEach(k=>document.getElementById('V'+k).classList.remove('on'));
  const vg=document.getElementById('VG');vg.style.display='flex';
  document.querySelectorAll('.ni').forEach(el=>el.classList.remove('on'));
  const nav=document.getElementById('n'+g);if(nav)nav.classList.add('on');
  closeSB();
}
function reloadG(){if(AG)play(AG)}
function hideFLoad(){const f=document.getElementById('FL');f.style.opacity='0';f.style.pointerEvents='none'}

// ── OVERLAYS ──
function showLvlUp(lv){
  const o=document.getElementById('LUO');
  document.getElementById('LUN').textContent='Nivel '+lv.l;
  document.getElementById('LUT').textContent=lv.n;
  document.getElementById('LUB').style.animation='none';
  document.getElementById('LUB').offsetHeight;
  document.getElementById('LUB').style.animation='lvlUp .6s cubic-bezier(.34,1.56,.64,1)';
  o.style.display='flex';
}
function showBadgeToast(b){
  document.getElementById('BTI').textContent=b.ic;
  document.getElementById('BTN').textContent=b.n;
  document.getElementById('BTD').textContent=b.d;
  const t=document.getElementById('BTO');
  t.style.display='block';
  t.style.animation='none';t.offsetHeight;t.style.animation='slideIn .4s ease';
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',4500);
}

// ── ADMIN / LOGOUT ──
function goAdmin(){const go=u=>window.top.location.href=u+'?page=Admin';if(WU)go(WU);else try{google.script.run.withSuccessHandler(go).getWebAppUrl()}catch(e){}}
function doLogout(){U=null;sessionStorage.removeItem('sst_u');document.getElementById('APP').style.display='none';document.getElementById('LS').style.display='flex';document.getElementById('DI').value='';document.getElementById('LE').style.display='none';document.getElementById('GF').src=''}

// ── MENSAJES DE IFRAMES ──
window.addEventListener('message',e=>{
  if(!e.data)return;
  if(e.data.sst_action==='goHome'){showV('I')}
  if(e.data.sst_action==='gameFinished'){loadProfile(false)}
});

// ── RENDER: INICIO ──
function renderHome(){
  const lv=getLvl(PROF.xp),pct=xpPct(PROF.xp),badges=calcBadges(PROF),earned=badges.filter(b=>b.earned).length;
  const n=U?((U.nombre||'')+(U.apellido?' '+U.apellido:'')):'Usuario';
  const toNext=lv.max===99999?'Nivel máximo alcanzado':'Faltan '+(lv.max-PROF.xp)+' XP para '+getLvl(PROF.xp+1).n;
  let gc='';
  Object.keys(GS).forEach(k=>{
    const g=GS[k],best=PROF.gBest[g.n]||PROF.gBest[k+' SST']||0;
    gc+=`<div onclick="play('${k}')" style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:12px" onmouseover="this.style.borderColor='${g.col}';this.style.transform='translateY(-2px)'" onmouseout="this.style.borderColor='var(--border)';this.style.transform=''">
      <div style="width:42px;height:42px;border-radius:10px;background:${g.col}22;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${g.ic}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px">${g.n}</div>
        <div style="font-size:11px;color:var(--text2);margin-bottom:6px">${getDiffDesc(k)}</div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;background:${g.col}22;color:${g.col}">${g.diff} · IA</span>
          <span style="font-size:11px;color:var(--text3)">Mejor: <strong style="color:${best?g.col:'var(--text3)'}">${best||'—'}</strong></span>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('VI').innerHTML=`
  <div style="background:linear-gradient(135deg,#0f2d5e 0%,#1f6feb 60%,#388bfd 100%);border-radius:14px;padding:28px;margin-bottom:20px;position:relative;overflow:hidden">
    <div style="position:absolute;right:-20px;top:-20px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.05)"></div>
    <div style="position:absolute;right:60px;bottom:-40px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.04)"></div>
    <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Bienvenido de vuelta</div>
    <div style="font-size:30px;font-weight:900;letter-spacing:-1px;color:#fff;margin-bottom:4px;position:relative">${n}</div>
    <div style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:20px;padding:4px 12px;margin-bottom:14px">
      <span style="font-size:12px;font-weight:700;color:${lv.c}">⚡ Nivel ${lv.l}</span>
      <span style="font-size:11px;color:rgba(255,255,255,.6)">${lv.n}</span>
    </div>
    <div style="max-width:360px">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px">
        <span style="font-size:11px;color:rgba(255,255,255,.6)">${PROF.xp} XP</span>
        <span style="font-size:11px;color:rgba(255,255,255,.4)">${toNext}</span>
      </div>
      <div style="background:rgba(0,0,0,.3);border-radius:4px;height:8px;overflow:hidden">
        <div style="height:100%;border-radius:4px;background:${lv.c};width:${pct}%;transition:width 1.2s ease;box-shadow:0 0 8px ${lv.c}88"></div>
      </div>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px">
    ${statCard('⚡',PROF.xp,'XP Total','#1f6feb')}
    ${statCard('🎮',PROF.total,'Partidas','#3fb950')}
    ${statCard('🏆',PROF.best,'Mejor Puntaje','#d29922')}
    ${statCard('🏅',earned,'Insignias','#8957e5')}
  </div>
  <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px">Módulos disponibles</div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px">${gc}</div>`;
}
function statCard(ic,val,lbl,col){return`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;border-top:3px solid ${col}"><div style="font-size:16px;margin-bottom:6px">${ic}</div><div style="font-size:24px;font-weight:800;color:var(--text);letter-spacing:-.5px">${val}</div><div style="font-size:11px;color:var(--text3);margin-top:1px">${lbl}</div></div>`}
function getDiffDesc(k){return{Kahoot:'Responde preguntas contra el reloj. ¡Hazlo más rápido para más puntos!',Mahjong:'Empareja conceptos con sus definiciones',Memoria:'Encuentra los pares ocultos de SST',DragDrop:'Clasifica elementos arrastrándolos',Simulacion:'Detecta peligros en escenarios laborales',Pupiletras:'Encuentra palabras de SSOMA ocultas en la sopa de letras',Crucigrama:'Completa el crucigrama con términos de SSOMA'}[k]||''}

// ── RENDER: PERFIL ──
function renderProfile(){
  const lv=getLvl(PROF.xp),pct=xpPct(PROF.xp),badges=calcBadges(PROF);
  const n=U?((U.nombre||'')+(U.apellido?' '+U.apellido:'')):'—';
  const ini=n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()||'--';
  let badgeHtml='';
  badges.forEach(b=>{
    badgeHtml+=`<div title="${b.n}: ${b.d}" style="background:${b.earned?'var(--bg3)':'var(--bg2)'};border:1px solid ${b.earned?lv.c:'var(--border)'};border-radius:10px;padding:12px 8px;text-align:center;opacity:${b.earned?'1':'.35'};transition:all .2s">
      <div style="font-size:26px;margin-bottom:5px">${b.ic}</div>
      <div style="font-size:10px;font-weight:700;color:${b.earned?'var(--text)':'var(--text3)'};line-height:1.3">${b.n}</div>
    </div>`;
  });
  const recientes=PROF.scores.slice(-8).reverse().map(s=>`<tr><td style="padding:8px 10px;font-size:12px;color:var(--text2)">${String(s.fecha).split(' ')[0]||'—'}</td><td style="padding:8px 10px;font-size:12px;color:var(--text);font-weight:600">${s.juego||'—'}</td><td style="padding:8px 10px;font-size:12px;font-weight:700;color:var(--gold)">${s.puntaje||0}</td></tr>`).join('');
  document.getElementById('VP').innerHTML=`
  <div style="max-width:680px;margin:0 auto">
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:16px;display:flex;align-items:center;gap:20px">
      <div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#3fb950,#56d364);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 0 0 4px ${lv.c}55,0 0 0 6px ${lv.c}22">${ini}</div>
      <div style="flex:1">
        <div style="font-size:20px;font-weight:800;color:var(--text);letter-spacing:-.3px">${n}</div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:8px">DNI: ${U.dni||'—'}</div>
        <div style="display:inline-flex;align-items:center;gap:6px;background:${lv.c}22;border-radius:20px;padding:4px 12px">
          <span style="font-size:12px;font-weight:700;color:${lv.c}">⚡ Nivel ${lv.l} · ${lv.n}</span>
        </div>
      </div>
      <div style="text-align:right">
        <div style="font-size:28px;font-weight:900;color:${lv.c}">${PROF.xp}</div>
        <div style="font-size:11px;color:var(--text3)">XP Total</div>
      </div>
    </div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px">
      <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">Progreso de nivel</div>
      <div style="display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px;color:var(--text2)"><span>${lv.n} (${lv.min} XP)</span><span>${lv.max===99999?'Máximo':'→ '+getLvl(PROF.xp+1).n+' ('+lv.max+' XP)'}</span></div>
      <div style="background:var(--bg3);border-radius:6px;height:10px;overflow:hidden">
        <div style="height:100%;background:${lv.c};width:${pct}%;border-radius:6px;transition:width 1s ease;box-shadow:0 0 6px ${lv.c}66"></div>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:6px;text-align:right">${pct}% completado</div>
    </div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px">
      <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px">Insignias (${badges.filter(b=>b.earned).length}/${badges.length})</div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">${badgeHtml}</div>
    </div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden">
      <div style="padding:14px 16px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px">Últimas partidas</div>
      <table style="width:100%;border-collapse:collapse">
        <thead><tr style="background:var(--bg3)"><th style="padding:8px 10px;font-size:11px;color:var(--text3);font-weight:600;text-align:left">Fecha</th><th style="padding:8px 10px;font-size:11px;color:var(--text3);font-weight:600;text-align:left">Módulo</th><th style="padding:8px 10px;font-size:11px;color:var(--text3);font-weight:600;text-align:left">Puntaje</th></tr></thead>
        <tbody>${recientes||'<tr><td colspan="3" style="padding:20px;text-align:center;color:var(--text3);font-size:13px">Aún no has jugado ninguna partida</td></tr>'}</tbody>
      </table>
    </div>
  </div>`;
}

// ── RENDER: RANKING ──
function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function renderRanking(){
  document.getElementById('VR').innerHTML='<div style="display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text3)"><div class="fring"></div></div>';
  try{
    google.script.run.withSuccessHandler(r=>{
      if(!r||!r.success||!r.players.length){document.getElementById('VR').innerHTML='<div style="text-align:center;padding:40px;color:var(--text3)">No hay datos de ranking aún.<br>¡Juega la primera partida!</div>';return}
      const medals=['🥇','🥈','🥉'];
      let rows='';
      r.players.forEach((p,i)=>{
        const isSelf=p.dni===U.dni;
        const lv=getLvl(p.totalXP);
        rows+=`<tr style="background:${isSelf?'#1a2840':'transparent'};border-bottom:1px solid var(--border2)">
          <td style="padding:12px 14px;font-size:16px;text-align:center">${medals[i]||'<span style="font-size:13px;color:var(--text3);font-weight:700">#'+(i+1)+'</span>'}</td>
          <td style="padding:12px 14px">
            <div style="font-size:13px;font-weight:${isSelf?'800':'600'};color:${isSelf?'var(--blue2)':'var(--text)'}">${escH(p.nombre)}${isSelf?' (Tu)':''}</div>
            <div style="font-size:11px;color:${lv.c};margin-top:1px">Nivel ${lv.l} · ${lv.n}</div>
          </td>
          <td style="padding:12px 14px;font-size:15px;font-weight:800;color:var(--gold)">${p.totalXP} <span style="font-size:11px;font-weight:500;color:var(--text3)">XP</span></td>
          <td style="padding:12px 14px;font-size:13px;color:var(--text2);text-align:center">${p.games}</td>
          <td style="padding:12px 14px;text-align:center"><div style="display:inline-flex;gap:3px">${'🎮'.repeat(Math.min(p.uniqueGames,5))}</div></td>
        </tr>`;
      });
      document.getElementById('VR').innerHTML=`
      <div style="font-size:20px;font-weight:800;color:var(--text);margin-bottom:4px">🏆 Tabla de Líderes</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:20px">Top jugadores del programa SST</div>
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden">
        <table style="width:100%;border-collapse:collapse">
          <thead><tr style="background:var(--bg3)">
            <th style="padding:10px 14px;font-size:11px;color:var(--text3);font-weight:600;text-align:center">#</th>
            <th style="padding:10px 14px;font-size:11px;color:var(--text3);font-weight:600;text-align:left">Jugador</th>
            <th style="padding:10px 14px;font-size:11px;color:var(--text3);font-weight:600;text-align:left">XP Total</th>
            <th style="padding:10px 14px;font-size:11px;color:var(--text3);font-weight:600;text-align:center">Partidas</th>
            <th style="padding:10px 14px;font-size:11px;color:var(--text3);font-weight:600;text-align:center">Módulos</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    }).getLeaderboardGlobal();
  }catch(e){document.getElementById('VR').innerHTML='<div style="text-align:center;padding:40px;color:var(--text3)">No se pudo cargar el ranking.</div>'}
}

// ── RENDER: MISIONES ──
function renderMissions(){
  const today=new Date().toDateString();
  const todayScores=PROF.scores.filter(s=>new Date(s.fecha).toDateString()===today);
  const weekAgo=Date.now()-7*24*3600*1000;
  const weekScores=PROF.scores.filter(s=>new Date(s.fecha)>=weekAgo);
  const todayPts=todayScores.reduce((a,s)=>a+s.puntaje,0);
  const weekPts=weekScores.reduce((a,s)=>a+s.puntaje,0);
  const weekUniq=new Set(weekScores.map(s=>s.juego)).size;
  const dm=[
    {ic:'🎮',n:'Primera del día',d:'Juega 1 partida hoy',prog:Math.min(1,todayScores.length),max:1,xp:50},
    {ic:'⭐',n:'Puntuador',d:'Consigue 500+ puntos hoy',prog:Math.min(500,todayPts),max:500,xp:80},
    {ic:'🔥',n:'Maratón diario',d:'Completa 3 juegos hoy',prog:Math.min(3,todayScores.length),max:3,xp:150},
  ];
  const wm=[
    {ic:'🏆',n:'Explorador',d:'Juega los 5 módulos esta semana',prog:Math.min(5,weekUniq),max:5,xp:300},
    {ic:'💯',n:'Semana intensa',d:'Acumula 2000 puntos esta semana',prog:Math.min(2000,weekPts),max:2000,xp:200},
    {ic:'🎯',n:'Dedicado',d:'Juega 10 partidas esta semana',prog:Math.min(10,weekScores.length),max:10,xp:500},
  ];
  const mCard=(m,done)=>`<div style="background:var(--bg2);border:1px solid ${done?'#3fb95066':'var(--border)'};border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;${done?'opacity:.75':''}">
    <div style="font-size:28px">${done?'✅':m.ic}</div>
    <div style="flex:1">
      <div style="font-size:13px;font-weight:700;color:var(--text)">${m.n}</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:8px">${m.d}</div>
      <div style="background:var(--bg3);border-radius:4px;height:6px;overflow:hidden">
        <div style="height:100%;background:${done?'#3fb950':'var(--blue)'};width:${Math.min(100,Math.round(m.prog/m.max*100))}%;border-radius:4px;transition:width .8s ease"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:4px">
        <span style="font-size:11px;color:var(--text3)">${m.prog}/${m.max}</span>
        <span style="font-size:11px;font-weight:700;color:var(--gold)">+${m.xp} XP</span>
      </div>
    </div>
  </div>`;
  document.getElementById('VM').innerHTML=`
  <div style="font-size:20px;font-weight:800;color:var(--text);margin-bottom:4px">🎯 Misiones</div>
  <div style="font-size:12px;color:var(--text3);margin-bottom:20px">Completa misiones para ganar XP bonus</div>
  <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">Misiones diarias</div>
  <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:22px">${dm.map(m=>mCard(m,m.prog>=m.max)).join('')}</div>
  <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">Misiones semanales</div>
  <div style="display:flex;flex-direction:column;gap:8px">${wm.map(m=>mCard(m,m.prog>=m.max)).join('')}</div>`;
}

// ── INIT ──
document.addEventListener('DOMContentLoaded',()=>{
  const s=sessionStorage.getItem('sst_u');
  if(s){U=JSON.parse(s);bootApp()}
  else document.getElementById('DI').focus();
  try{google.script.run.withSuccessHandler(u=>WU=u).getWebAppUrl()}catch(e){}
});
</script>
</body>
