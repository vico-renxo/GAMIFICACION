<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-950: #06101b;
  --bg-900: #091523;
  --bg-850: #0d1e31;
  --bg-800: #12273f;
  --panel: rgba(12, 24, 40, 0.82);
  --panel-strong: rgba(9, 18, 31, 0.92);
  --panel-soft: rgba(255, 255, 255, 0.05);
  --glass-bg: rgba(12, 24, 40, 0.62);
  --glass-strong: rgba(10, 20, 34, 0.76);
  --line: rgba(150, 190, 255, 0.16);
  --line-strong: rgba(150, 190, 255, 0.28);
  --text-base: #f4f8ff;
  --text-soft: #d6e3f4;
  --text-muted: #93a9c0;
  --text-dim: #6d8398;
  --cyan: #3bdcff;
  --blue: #5f8dff;
  --violet: #8b7bff;
  --green: #39d98a;
  --amber: #f7b84b;
  --orange: #ff9348;
  --red: #ff6f7d;
  --danger-soft: rgba(255, 111, 125, 0.14);
  --success-soft: rgba(57, 217, 138, 0.16);
  --info-soft: rgba(59, 220, 255, 0.14);
  --warning-soft: rgba(247, 184, 75, 0.16);
  --shadow-sm: 0 10px 24px rgba(3, 10, 20, 0.16);
  --shadow-md: 0 18px 36px rgba(3, 10, 20, 0.26);
  --shadow-lg: 0 30px 70px rgba(2, 8, 18, 0.42);
  --radius-xs: 10px;
  --radius-sm: 16px;
  --radius-md: 22px;
  --radius-lg: 30px;
  --radius-xl: 38px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body.sst-shell {
  font-family: "Nunito", sans-serif;
  min-height: 100vh;
  color: var(--text-base);
  background:
    radial-gradient(circle at top right, rgba(59, 220, 255, 0.16), transparent 34%),
    radial-gradient(circle at bottom left, rgba(247, 184, 75, 0.13), transparent 30%),
    linear-gradient(160deg, var(--bg-950) 0%, var(--bg-900) 46%, var(--bg-850) 100%);
  overflow-x: hidden;
  position: relative;
  -webkit-font-smoothing: antialiased;
}

body.sst-shell::before,
body.sst-shell::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

body.sst-shell::before {
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
  background-size: 44px 44px;
  opacity: 0.28;
  mask-image: radial-gradient(circle at center, black 48%, transparent 100%);
}

body.sst-shell::after {
  background:
    radial-gradient(circle at 15% 18%, rgba(139, 123, 255, 0.16), transparent 24%),
    radial-gradient(circle at 82% 12%, rgba(59, 220, 255, 0.18), transparent 28%);
}

body.sst-shell > * {
  position: relative;
  z-index: 1;
}

img {
  display: block;
  max-width: 100%;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  color: inherit;
}

a {
  color: inherit;
}

::selection {
  background: rgba(95, 141, 255, 0.32);
  color: #fff;
}

.hidden {
  display: none !important;
}

.glass {
  background: var(--glass-bg);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  backdrop-filter: blur(18px) saturate(1.25);
  -webkit-backdrop-filter: blur(18px) saturate(1.25);
}

.tone-success { color: var(--green) !important; }
.tone-info { color: var(--cyan) !important; }
.tone-primary { color: var(--blue) !important; }
.tone-warning { color: var(--amber) !important; }
.tone-danger { color: var(--red) !important; }

.score-total {
  color: var(--green);
  font-size: 2rem;
  font-family: "Fredoka", cursive;
  font-weight: 700;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes popIn {
  from {
    opacity: 0;
    transform: scale(0.92);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes softPulse {
  0%, 100% { transform: translateY(0); box-shadow: 0 0 0 0 rgba(59, 220, 255, 0.14); }
  50% { transform: translateY(-2px); box-shadow: 0 0 0 10px transparent; }
}

body.sst-shell {
  --accent: var(--cyan);
  --accent-strong: var(--blue);
  --accent-soft: #8beaff;
  --accent-surface: rgba(59, 220, 255, 0.12);
}

body.page-quiz {
  --accent: var(--violet);
  --accent-strong: #ab92ff;
  --accent-soft: #c4b7ff;
  --accent-surface: rgba(139, 123, 255, 0.14);
}

body.page-memoria {
  --accent: var(--cyan);
  --accent-strong: #74b9ff;
  --accent-soft: #9fe8ff;
  --accent-surface: rgba(59, 220, 255, 0.14);
}

body.page-dragdrop {
  --accent: var(--green);
  --accent-strong: #7be7ad;
  --accent-soft: #a7f1c9;
  --accent-surface: rgba(57, 217, 138, 0.14);
}

body.page-mahjong {
  --accent: var(--amber);
  --accent-strong: #ffc86a;
  --accent-soft: #ffd995;
  --accent-surface: rgba(247, 184, 75, 0.14);
}

body.page-simulacion {
  --accent: var(--red);
  --accent-strong: #ff9198;
  --accent-soft: #ffb2b8;
  --accent-surface: rgba(255, 111, 125, 0.14);
}

body.page-pupiletras {
  --accent: var(--orange);
  --accent-strong: #ffb278;
  --accent-soft: #ffd1af;
  --accent-surface: rgba(255, 147, 72, 0.14);
}

body.page-crucigrama {
  --accent: var(--blue);
  --accent-strong: #8db5ff;
  --accent-soft: #b5ccff;
  --accent-surface: rgba(95, 141, 255, 0.14);
}

body.page-admin {
  --accent: var(--violet);
  --accent-strong: #a99eff;
  --accent-soft: #d1c9ff;
  --accent-surface: rgba(139, 123, 255, 0.14);
}

body.page-kahoot {
  --accent: var(--cyan);
  --accent-strong: var(--blue);
  --accent-soft: #8beaff;
  --accent-surface: rgba(59, 220, 255, 0.14);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  padding: 18px 20px;
  background: rgba(6, 16, 28, 0.82);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 16px 34px rgba(1, 7, 16, 0.18);
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.topbar-left h1 {
  font-family: "Fredoka", cursive;
  font-size: clamp(1.02rem, 1rem + 0.55vw, 1.4rem);
  line-height: 1.15;
  color: var(--accent-soft);
  letter-spacing: 0.02em;
}

.btn-back,
.btn-new,
.btn-sm,
.btn-next,
.btn-finish,
.btn-generate,
.modal-btns button,
.res-btns button,
.btn.btn-primary,
.btn.btn-ghost,
.gallery-card__btn,
.ranking-modal-close,
.manual-mini-btn,
.btn-toggle {
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease, border-color 0.22s ease, opacity 0.22s ease;
}

.btn-back {
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--line);
  color: var(--text-soft);
  font-weight: 800;
  letter-spacing: 0.02em;
}

.btn-back:hover {
  transform: translateY(-1px);
  background: rgba(255, 255, 255, 0.12);
  box-shadow: var(--shadow-sm);
}

.stats {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.stat {
  min-width: 94px;
  padding: 11px 14px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--line);
  text-align: center;
  box-shadow: var(--shadow-sm);
}

.stat .v,
.stat .rv {
  font-family: "Fredoka", cursive;
  font-size: 1.24rem;
  font-weight: 700;
  line-height: 1;
}

.stat .l,
.res-stats .rs .rl {
  margin-top: 5px;
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  font-weight: 800;
}

.btn-new,
.btn-next,
.btn-finish,
.btn-generate,
.modal-btns .btn-primary,
.res-btns .btn-primary,
.manual-mini-btn.primary,
.btn-toggle,
.gallery-card__btn,
.btn.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-strong));
  color: #04101d;
  box-shadow: 0 14px 28px rgba(3, 10, 20, 0.22), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
  font-weight: 900;
}

.btn-new:hover,
.btn-next:hover,
.btn-finish:hover,
.btn-generate:hover,
.modal-btns .btn-primary:hover,
.res-btns .btn-primary:hover,
.manual-mini-btn.primary:hover,
.btn-toggle:hover,
.gallery-card__btn:hover,
.btn.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 20px 36px rgba(2, 8, 18, 0.28);
}

.btn-sm,
.modal-btns .btn-secondary,
.res-btns .btn-secondary,
.manual-mini-btn.secondary,
.manual-mini-btn.danger,
.btn.btn-ghost {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--line);
  color: var(--text-soft);
  font-weight: 800;
}

.btn-sm:hover,
.modal-btns .btn-secondary:hover,
.res-btns .btn-secondary:hover,
.manual-mini-btn.secondary:hover,
.manual-mini-btn.danger:hover,
.btn.btn-ghost:hover {
  transform: translateY(-1px);
  background: rgba(255, 255, 255, 0.12);
}

.btn-spaced {
  margin-top: 30px;
}

.btn-compact {
  padding: 10px 20px !important;
}

.mb-20 {
  margin-bottom: 20px !important;
}

.field-label {
  display: block;
  margin-bottom: 6px;
  font-size: 12px;
  font-weight: 800;
  color: var(--text-muted);
}

.copy-note {
  color: var(--text-muted);
  line-height: 1.6;
  margin-bottom: 16px;
}

.copy-note.compact {
  margin-bottom: 14px;
}

.row-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.row-actions.centered {
  align-items: center;
}

.option-check {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-muted);
}

.stack-grid {
  display: grid;
  gap: 16px;
}

.span-full {
  grid-column: 1 / -1;
}

.result-card-flat {
  margin-top: 0 !important;
  margin-bottom: 16px !important;
}

.config-actions {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.flex-1 {
  flex: 1;
}

.btn-success {
  background: linear-gradient(135deg, var(--green), #66bb6a) !important;
  box-shadow: 0 4px 15px rgba(67, 160, 71, 0.3) !important;
}

.loading {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  background: linear-gradient(160deg, rgba(6, 16, 28, 0.96), rgba(11, 25, 42, 0.97));
}

.loading.hidden {
  display: none;
}

.ld-spinner,
.processing .proc-spinner {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 4px solid rgba(255, 255, 255, 0.1);
  border-top-color: var(--accent);
  animation: spin 0.8s linear infinite;
  box-shadow: 0 0 0 8px rgba(255, 255, 255, 0.03);
}

.ld-text,
.processing .proc-text {
  font-family: "Fredoka", cursive;
  color: var(--accent-soft);
  font-size: 1rem;
  letter-spacing: 0.02em;
}

.modal-bg,
.results-bg {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(2, 8, 18, 0.62);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.modal-bg.show,
.results-bg.show {
  display: flex;
}

.modal,
.results {
  width: min(92vw, 460px);
  padding: 34px 32px;
  border-radius: var(--radius-lg);
  background: linear-gradient(180deg, rgba(14, 27, 44, 0.98), rgba(9, 19, 33, 0.98));
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  color: var(--text-soft);
  animation: popIn 0.36s ease;
}

.modal .trophy,
.results .trophy {
  font-size: 3.3rem;
  margin-bottom: 10px;
}

.modal h2,
.results h2 {
  font-family: "Fredoka", cursive;
  font-size: 1.55rem;
  color: var(--text-base);
  margin-bottom: 10px;
}

.modal .info,
.results .score-lbl,
.results .info {
  color: var(--text-muted);
  line-height: 1.55;
}

.modal .info strong,
.results .info strong {
  color: var(--accent-soft);
}

.modal-btns,
.res-btns {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.progress-track {
  width: 100%;
  height: 8px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.04);
}

.progress-fill {
  width: 0;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), var(--accent-strong));
  box-shadow: 0 0 24px rgba(59, 220, 255, 0.28);
  transition: width 0.35s ease;
}

.quiz-area,
.game-area,
.game-layout {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
}

.progress-dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 16px 18px 6px;
}

.dot {
  width: 12px;
  height: 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  transition: transform 0.2s ease, background 0.2s ease;
}

.dot.current {
  background: var(--accent);
  transform: scale(1.25);
}

.dot.correct { background: var(--green); }
.dot.wrong { background: var(--red); }

.q-card,
.exp-card,
.scene-header,
.timer-card,
.hazards-list,
.upload-area,
.content-list,
.config-card,
.manual-manager,
.manual-form-card,
.manual-table-wrap,
.quiz-ai-panel,
.result-card,
.file-preview,
.drop-zone,
.card-front,
.card-back,
.hz-item {
  background: linear-gradient(180deg, rgba(15, 30, 49, 0.94), rgba(10, 20, 34, 0.98));
  border: 1px solid var(--line);
  box-shadow: var(--shadow-md);
}

.q-card,
.scene-header,
.timer-card,
.hazards-list,
.upload-area,
.content-list,
.config-card,
.manual-manager,
.manual-form-card,
.quiz-ai-panel {
  border-radius: var(--radius-md);
}

.q-card {
  padding: 30px 28px;
  margin-bottom: 18px;
  animation: fadeUp 0.35s ease;
}

.q-num {
  margin-bottom: 12px;
  color: var(--accent-soft);
  font-family: "Fredoka", cursive;
  font-size: 0.78rem;
  letter-spacing: 0.2em;
}

.q-text {
  margin-bottom: 22px;
  font-size: clamp(1.35rem, 1.15rem + 0.9vw, 2rem);
  line-height: 1.28;
  font-weight: 900;
  color: var(--text-base);
}

.timer-bar {
  height: 7px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  margin-bottom: 22px;
}

.timer-fill {
  width: 100%;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--green), var(--amber), var(--red));
  transition: width 0.08s linear;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.opt-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 16px 18px;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-soft);
  text-align: left;
  font-size: 1rem;
  font-weight: 800;
}

.opt-btn:hover:not(.disabled) {
  transform: translateY(-2px);
  background: var(--accent-surface);
  border-color: var(--line-strong);
}

.opt-btn .letter {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.08);
  color: var(--accent-soft);
  font-family: "Fredoka", cursive;
  font-size: 0.96rem;
  font-weight: 700;
}

.opt-btn.correct,
.opt-btn.reveal-correct {
  background: var(--success-soft);
  border-color: rgba(57, 217, 138, 0.34);
}

.opt-btn.correct .letter,
.opt-btn.reveal-correct .letter {
  background: var(--green);
  color: #062113;
}

.opt-btn.wrong {
  background: var(--danger-soft);
  border-color: rgba(255, 111, 125, 0.32);
}

.opt-btn.wrong .letter {
  background: var(--red);
  color: #2b0208;
}

.opt-btn.disabled {
  pointer-events: none;
  opacity: 0.64;
}

.exp-card {
  display: none;
  padding: 18px 20px;
  margin-bottom: 18px;
  border-radius: 20px;
}

.exp-card.show {
  display: block;
  animation: fadeUp 0.25s ease;
}

.exp-card.success {
  border-left: 4px solid var(--green);
}

.exp-card.error {
  border-left: 4px solid var(--red);
}

.exp-card .eb,
.exp-panel .badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 999px;
  font-family: "Fredoka", cursive;
  font-size: 0.72rem;
  font-weight: 700;
  margin-bottom: 10px;
}

.exp-card.success .eb,
.exp-panel.success .badge {
  background: var(--success-soft);
  color: var(--green);
}

.exp-card.error .eb,
.exp-panel.error .badge {
  background: var(--danger-soft);
  color: var(--red);
}

.exp-card .et,
.exp-panel .et {
  color: var(--text-soft);
  line-height: 1.55;
}

.exp-card .ai,
.exp-panel .ai {
  margin-top: 8px;
  font-size: 0.72rem;
  color: var(--text-dim);
}

.btn-next {
  display: none;
  margin: 0 auto;
  padding: 14px 34px;
}

.btn-next.show {
  display: inline-flex;
}

.results .score-big {
  font-family: "Fredoka", cursive;
  font-size: clamp(2.6rem, 2.2rem + 1vw, 3.6rem);
  color: var(--green);
  margin-bottom: 6px;
}

.res-stats {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 22px 0 24px;
  flex-wrap: wrap;
}

.res-stats .rs {
  min-width: 102px;
  padding: 12px 14px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--line);
}

.res-stats .rs .rv {
  font-family: "Fredoka", cursive;
  font-size: 1.35rem;
  font-weight: 700;
}

.board {
  width: 100%;
}

.game-area {
  display: flex;
  gap: 20px;
  padding: 18px 0 34px;
}

.board,
.items-pool,
.drop-zones,
.scene-panel,
.info-panel {
  min-width: 0;
}

.board {
  display: grid;
}

.card {
  aspect-ratio: 3 / 4;
  perspective: 900px;
  cursor: pointer;
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
  transform-style: preserve-3d;
}

.card.flipped .card-inner,
.card.matched .card-inner {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  inset: 0;
  padding: 12px;
  border-radius: 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
}

.card-front .icon {
  font-size: 2rem;
  margin-bottom: 6px;
}

.card-front .label {
  font-family: "Fredoka", cursive;
  font-size: 0.68rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.card-back {
  transform: rotateY(180deg);
  border-color: rgba(59, 220, 255, 0.28);

window.SFX = (() => {
  let ctx = null;
  function getCtx(){if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return ctx;}
  function play(type){
    const c=getCtx();if(!c){if(navigator.vibrate)navigator.vibrate(50);return;}
    const now=c.currentTime,g=c.createGain();g.connect(c.destination);g.gain.value=.15;
    const o=c.createOscillator();o.connect(g);
    const cfg={
      correct:{t:'square',f:[523,659,784],d:.35,step:.1},
      wrong:{t:'sawtooth',f:[300,100],d:.35,ramp:true},
      countdown:{t:'square',f:[440],d:.15},
      go:{t:'square',f:[523,659,784,1047],d:.4,step:.08,v:.2},
      victory:{t:'square',f:[523,659,784,1047,784,1047],d:.8,step:.12,v:.12},

  const c=document.getElementById(containerId);if(!c)return;
  const cols=['var(--cyan)','var(--violet)','var(--green)','var(--amber)','var(--red)'];
  for(let i=0;i<12;i++){
    const p=document.createElement('div');p.className='ge-particle';
    p.style.left=Math.random()*100+'%';p.style.bottom='0';
    p.style.animationDelay=Math.random()*8+'s';p.style.animationDuration=(6+Math.random()*6)+'s';
    p.style.background=cols[Math.floor(Math.random()*cols.length)];c.appendChild(p);
  }
};

window.launchConfetti = function(canvasId){
  const canvas=document.getElementById(canvasId);if(!canvas)return;
  const ctx2=canvas.getContext('2d');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const pieces=[];const colors=['#00f5ff','#ff006e','#39ff14','#ff9500','#bf00ff','#FFD700'];
  for(let i=0;i<120;i++)pieces.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height-canvas.height,w:Math.random()*10+5,h:Math.random()*10+5,color:colors[Math.floor(Math.random()*colors.length)],speed:Math.random()*3+2,wobble:Math.random()*2-1,rot:Math.random()*360});
  let frame=0;
  function animate(){ctx2.clearRect(0,0,canvas.width,canvas.height);pieces.forEach(p=>{ctx2.save();ctx2.translate(p.x,p.y);ctx2.rotate(p.rot*Math.PI/180);ctx2.fillStyle=p.color;ctx2.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx2.restore();p.y+=p.speed;p.x+=p.wobble;p.rot+=2;if(p.y>canvas.height)p.y=-10;});frame++;if(frame<300)requestAnimationFrame(animate);else ctx2.clearRect(0,0,canvas.width,canvas.height);}
  animate();
};

window.showGameToast = function(containerId,title,msg,type){
  const c=document.getElementById(containerId);if(!c)return;
  const t=document.createElement('div');t.className='ge-toast '+(type||'info');
  t.innerHTML='<div><div class="ge-toast-title">'+title+'</div><div class="ge-toast-msg">'+msg+'</div></div>';
  c.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(100%)';t.style.transition='all .3s';setTimeout(()=>t.remove(),300);},3500);
};
</script>
